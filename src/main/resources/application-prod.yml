application:
  cors:
    allowed-origins: ${CORS-ORIGINS:https://academiq-front.onrender.com}

spring:
  datasource:
    url: ${DB-URL}
    username: ${DB-USERNAME:}
    password: ${DB-PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
