application:
  cors:
    allowed-origins: ${CORS-ORIGINS:https://academiq-front.onrender.com}

spring:
  datasource:
    url: jdbc:mysql://${DB-HOST}:${DB-PORT}/${DB-NAME}?sslMode=REQUIRED&allowPublicKeyRetrieval=true
    username: ${DB-USER}
    password: ${DB-PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
