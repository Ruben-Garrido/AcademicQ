application:
  cors:
    allowed-origins: ${CORS-ORIGINS:https://academiq-front.onrender.com}

spring:
  datasource:
    url: ${DB-URL}
    username: ${DB-USERNAME:}
    password: ${DB-PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      data-source-properties:
        sslMode: TRUST

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
